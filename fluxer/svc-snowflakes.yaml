# Fluxer internal svc "snowflakes" (ID allocation). Every internal svc runs as a
# stateless router plus one shard (FLUXER_SVC_SHARD_COUNT=1, shard id 0), talking
# over NATS, exactly like the snowflakes/snowflakes-shard pair in Compose. Neither is
# called over HTTP, so there is no Service; port 8090 only serves health checks.
#
# The shard uses Recreate so two pods never hold shard id 0 at the same time.
#
# svc-users.yaml, svc-messages.yaml, svc-gifs.yaml and svc-unfurl.yaml follow the
# same shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-snowflakes
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-snowflakes
    app.kubernetes.io/component: snowflakes-router
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-snowflakes
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-snowflakes
        app.kubernetes.io/component: snowflakes-router
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snowflakes
          image: ghcr.io/fluxerapp/fluxer-snowflakes:2026.1010.212912@sha256:ce6f5a9de53c6c5e329de40cc602b51c02d654b028dc74687a4a8e730d4a98b0
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_SVC_NAME
              value: snowflakes
            - name: FLUXER_SVC_MODE
              value: router
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # /_healthz is process liveness; /_health also reflects dependencies.
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-snowflakes-shard
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-snowflakes-shard
    app.kubernetes.io/component: snowflakes-shard
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-snowflakes-shard
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-snowflakes-shard
        app.kubernetes.io/component: snowflakes-shard
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snowflakes-shard
          image: ghcr.io/fluxerapp/fluxer-snowflakes:2026.1010.212912@sha256:ce6f5a9de53c6c5e329de40cc602b51c02d654b028dc74687a4a8e730d4a98b0
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_SVC_NAME
              value: snowflakes
            - name: FLUXER_SVC_MODE
              value: shard
            - name: FLUXER_SVC_SHARD_ID
              value: "0"
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
