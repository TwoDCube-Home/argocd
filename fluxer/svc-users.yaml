# Fluxer internal svc "users" (user records and lookups): router + single shard over NATS, the
# users/users-shard pair in Compose. Same shape and rationale as svc-snowflakes.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-users
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-users
    app.kubernetes.io/component: users-router
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-users
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-users
        app.kubernetes.io/component: users-router
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: users
          image: ghcr.io/fluxerapp/fluxer-users:2026.1010.212851@sha256:6a96cd3f7edf3c5391c60a5c428174e371a4fb0e6cf0962eb8bc3a19eee500f7
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_SVC_NAME
              value: users
            - name: FLUXER_SVC_MODE
              value: router
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # /_healthz is process liveness; /_health also reflects dependencies.
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-users-shard
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-users-shard
    app.kubernetes.io/component: users-shard
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-users-shard
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-users-shard
        app.kubernetes.io/component: users-shard
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: users-shard
          image: ghcr.io/fluxerapp/fluxer-users:2026.1010.212851@sha256:6a96cd3f7edf3c5391c60a5c428174e371a4fb0e6cf0962eb8bc3a19eee500f7
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_SVC_NAME
              value: users
            - name: FLUXER_SVC_MODE
              value: shard
            - name: FLUXER_SVC_SHARD_ID
              value: "0"
            # The users shard reads Postgres directly (Compose sets this pool size).
            - name: FLUXER_POSTGRES_MAX_CONNECTIONS
              value: "20"
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
