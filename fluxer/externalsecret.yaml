# Fluxer application secrets, pulled from the 1Password item "fluxer" (vault: Server)
# through the namespace's onepassword SecretStore.
#
# Every secretKey is the exact environment variable name Fluxer reads, so the
# workloads load the whole Secret with envFrom. The values were generated in the
# formats the upstream installer uses (fluxer_docs/src/installer/install.sh):
# `openssl rand -hex 32` for most keys, `openssl rand -base64 32` for *_BASE64 keys,
# and a base64url P-256 key pair for VAPID.
#
# Deliberately NOT in 1Password (generated in-cluster instead):
#   - Postgres credentials and CA: Crunchy PGO (fluxer-postgres-pguser-fluxer,
#     fluxer-postgres-cluster-cert), see postgres.yaml
#   - S3 credentials: NooBaa, one Secret per ObjectBucketClaim, see objectbucketclaims.yaml
#
# Rotating FLUXER_ERLANG_COOKIE, FLUXER_LIVEKIT_API_SECRET or FLUXER_SEARCH_API_KEY
# needs a restart of every workload that reads it; the others invalidate sessions,
# signed media URLs or push subscriptions, so treat them as long-lived.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fluxer
  labels:
    app: fluxer
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
    # Meilisearch master key; also mounted into Meilisearch itself as MEILI_MASTER_KEY.
    - secretKey: FLUXER_SEARCH_API_KEY
      remoteRef:
        key: fluxer/meili-master-key
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # LiveKit API secret; the API key is the literal "fluxer" (configmap-env.yaml).
    - secretKey: FLUXER_LIVEKIT_API_SECRET
      remoteRef:
        key: fluxer/livekit-api-secret
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_SUDO_MODE_SECRET
      remoteRef:
        key: fluxer/sudo-mode-secret
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_CONNECTION_INITIATION_SECRET
      remoteRef:
        key: fluxer/connection-initiation-secret
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_PROFILE_PSEUDONYM_SECRET
      remoteRef:
        key: fluxer/profile-pseudonym-secret
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_GATEWAY_RPC_AUTH_TOKEN
      remoteRef:
        key: fluxer/gateway-rpc-auth-token
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # Read only by the gateway's entrypoint (Erlang distribution cookie).
    - secretKey: FLUXER_ERLANG_COOKIE
      remoteRef:
        key: fluxer/erlang-cookie
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_MEDIA_PROXY_SECRET_KEY
      remoteRef:
        key: fluxer/media-proxy-secret-key
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64
      remoteRef:
        key: fluxer/media-proxy-upload-relay-secret-base64
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_ADMIN_SECRET_KEY_BASE
      remoteRef:
        key: fluxer/admin-secret-key-base
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_ADMIN_OAUTH_CLIENT_SECRET
      remoteRef:
        key: fluxer/admin-oauth-client-secret
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # Web push (VAPID) key pair. Changing it invalidates every existing push subscription.
    - secretKey: FLUXER_VAPID_PUBLIC_KEY
      remoteRef:
        key: fluxer/vapid-public-key
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: FLUXER_VAPID_PRIVATE_KEY
      remoteRef:
        key: fluxer/vapid-private-key
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
