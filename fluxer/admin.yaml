# Fluxer admin dashboard (Rust), served by the edge under /admin. Compose service
# `admin`; it calls the API over the internal address, not the public one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-admin
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-admin
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-admin
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-admin
        app.kubernetes.io/component: admin
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: ghcr.io/fluxerapp/fluxer-admin:2026.1017.35317@sha256:e7bea2fd3833613695fbea4034cb1c3094379c54bc507e4462c01afd6a6864e5
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_ADMIN_PORT
              value: "8080"
            - name: FLUXER_ADMIN_BASE_PATH
              value: /admin
            - name: FLUXER_API_ENDPOINT
              value: http://fluxer-api:8080
            - name: FLUXER_STATIC_CDN_ENDPOINT
              value: https://fluxer.twodcube.dev
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fluxer-admin
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-admin
    app.kubernetes.io/part-of: fluxer
spec:
  selector:
    app.kubernetes.io/name: fluxer-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
