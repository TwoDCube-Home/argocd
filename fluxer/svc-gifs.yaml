# Fluxer internal svc "gifs" (GIF search via Klipy): router + single shard over NATS, the
# gifs/gifs-shard pair in Compose. Same shape and rationale as svc-snowflakes.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-gifs
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-gifs
    app.kubernetes.io/component: gifs-router
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-gifs
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-gifs
        app.kubernetes.io/component: gifs-router
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gifs
          image: ghcr.io/fluxerapp/fluxer-gifs:2026.1010.212908@sha256:855e726ce812198f518dfa14824c19eceaa955b6ddd3c61e0c9ad6a2dd45e9de
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_SVC_NAME
              value: gifs
            - name: FLUXER_SVC_MODE
              value: router
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # /_healthz is process liveness; /_health also reflects dependencies.
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-gifs-shard
  labels:
    app: fluxer
    app.kubernetes.io/name: fluxer-gifs-shard
    app.kubernetes.io/component: gifs-shard
    app.kubernetes.io/part-of: fluxer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxer-gifs-shard
  template:
    metadata:
      labels:
        app: fluxer
        app.kubernetes.io/name: fluxer-gifs-shard
        app.kubernetes.io/component: gifs-shard
        app.kubernetes.io/part-of: fluxer
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gifs-shard
          image: ghcr.io/fluxerapp/fluxer-gifs:2026.1010.212908@sha256:855e726ce812198f518dfa14824c19eceaa955b6ddd3c61e0c9ad6a2dd45e9de
          envFrom:
            - configMapRef:
                name: fluxer-env
            - secretRef:
                name: fluxer
          env:
            - name: FLUXER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-pguser-fluxer
                  key: uri
            - name: FLUXER_POSTGRES_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: fluxer-postgres-cluster-cert
                  key: ca.crt
            - name: FLUXER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxer-cdn
                  key: AWS_SECRET_ACCESS_KEY
            - name: FLUXER_SVC_NAME
              value: gifs
            - name: FLUXER_SVC_MODE
              value: shard
            - name: FLUXER_SVC_SHARD_ID
              value: "0"
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
