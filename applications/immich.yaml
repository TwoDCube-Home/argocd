apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Official Immich helm chart (OCI registry; the HTTP helm repo was discontinued upstream).
    # The chart does not manage the library PVC or the database - those live in the immich/ path below.
    - repoURL: ghcr.io/immich-app/immich-charts
      chart: immich
      targetRevision: 0.13.1
      helm:
        valuesObject:
          # Immich version for both server and machine-learning. The chart pins an
          # older default (its README says to set the tag yourself); bump this to
          # follow Immich releases. Valkey keeps its own image pinned by the chart.
          controllers:
            main:
              containers:
                main:
                  image:
                    tag: v3.1.0
          server:
            controllers:
              main:
                containers:
                  main:
                    env:
                      # Crunchy PGO ships pgvector (not VectorChord), so Immich must be
                      # told to use the pgvector extension explicitly.
                      DB_VECTOR_EXTENSION: pgvector
                      # Connection details come from the secret generated by the
                      # Crunchy operator for the PostgresCluster in immich/postgres.yaml.
                      DB_HOSTNAME:
                        valueFrom:
                          secretKeyRef:
                            name: immich-postgres-pguser-immich
                            key: host
                      DB_USERNAME:
                        valueFrom:
                          secretKeyRef:
                            name: immich-postgres-pguser-immich
                            key: user
                      DB_DATABASE_NAME:
                        valueFrom:
                          secretKeyRef:
                            name: immich-postgres-pguser-immich
                            key: dbname
                      DB_PASSWORD:
                        valueFrom:
                          secretKeyRef:
                            name: immich-postgres-pguser-immich
                            key: password
          # Redis-compatible queue bundled by the chart; job queues are disposable,
          # so the default emptyDir persistence is fine.
          valkey:
            enabled: true
          immich:
            persistence:
              library:
                # The chart requires a pre-existing PVC; created in immich/pvc.yaml.
                existingClaim: immich-library
          machine-learning:
            persistence:
              cache:
                # Persist downloaded ML models so they are not re-fetched on every pod restart.
                type: persistentVolumeClaim
                size: 10Gi
                accessMode: ReadWriteOnce
    # Supporting resources not covered by the chart: library PVC, Crunchy
    # PostgresCluster, and the OpenShift Route.
    - repoURL: https://github.com/TwoDCube-Home/argocd
      path: immich
  destination:
    name: in-cluster
    namespace: dev
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
